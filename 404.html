<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">YT SEO Suite - Premium AI Metadata Architect</title>
    <meta id="metaDesc" name="description" content="Elevate your YouTube performance with AI-driven metadata optimization.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXX" crossorigin="anonymous"></script>

    <style>
        body { background-color: #0d0d0d; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .search-container { display: flex; align-items: center; background-color: #111111; border: 1px solid #222222; border-radius: 20px; padding: 6px; width: 100%; max-width: 720px; margin: 0 auto; transition: all 0.3s ease; }
        .search-container:focus-within { border-color: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); }
        .search-icon { color: #ef4444; margin-left: 18px; margin-right: 12px; flex-shrink: 0; }
        .search-input { flex-grow: 1; background-color: transparent; border: none; outline: none; color: #ffffff; font-size: 16px; font-weight: 600; padding: 12px 0; }
        .search-input::placeholder { color: #444444; font-weight: 600; }
        .generate-btn { display: flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%); color: #ffffff; border: none; border-radius: 14px; padding: 12px 24px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; transition: all 0.2s ease; white-space: nowrap; }
        .generate-btn:hover { filter: brightness(1.1); }
        .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .glass-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.07); }
        .tag-pill { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1); color: #666; font-size: 10px; letter-spacing: 0.1em; }
        .premium-desc-text { color: #9ca3af; line-height: 1.7; font-weight: 400; }
        .footer-link { transition: color 0.3s ease; }
        .footer-link:hover { color: #ef4444; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="w-full max-w-7xl mx-auto px-8 py-10 flex justify-between items-center">
        <a href="/" class="text-3xl font-black tracking-tighter hover:opacity-80 transition">
            YT<span class="text-red-600">SEO.</span>
        </a>
    </nav>

    <main class="max-w-7xl mx-auto px-6">
        <div class="text-center py-10">
            <h1 id="dynamicHeading" class="text-5xl md:text-7xl font-black tracking-tight mb-6 uppercase leading-[1.1]">
                Inject <span class="text-red-600">SEO Power</span> into<br>your Metadata
            </h1>
            <p id="dynamicSub" class="premium-desc-text text-lg md:text-xl max-w-2xl mx-auto mb-12">
                Enter your video topic and let our SEO engine forge high-value metadata variations.
            </p>

            <form onsubmit="event.preventDefault(); handleGenerate();" class="search-container mb-6">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="topicInput" class="search-input" placeholder="Example: How to Cook Steak" autocomplete="off">
                <button type="submit" id="genBtn" class="generate-btn">
                    <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"></path>
                    </svg>
                    Generate
                </button>
            </form>

            <div class="flex flex-wrap justify-center gap-3 mb-20">
                <span class="tag-pill px-4 py-1.5 rounded-full font-bold">#SECRET</span>
                <span class="tag-pill px-4 py-1.5 rounded-full font-bold">#VIRAL</span>
                <span class="tag-pill px-4 py-1.5 rounded-full font-bold">#REVEALED</span>
            </div>
        </div>

        <div id="loading" class="hidden text-center mb-12 text-red-600 font-black animate-pulse tracking-[0.5em] text-xs uppercase">Forging Metadata DNA...</div>
        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-24"></div>
    </main>

    <footer class="border-t border-white/5 py-20 bg-black text-center">
        <div class="flex justify-center gap-8 mb-8 text-[10px] font-bold uppercase tracking-[0.2em] text-gray-500">
            <a href="/" class="footer-link">Home</a>
            <a href="/about" class="footer-link">About</a>
            <a href="/privacy-policy" class="footer-link">Privacy Policy</a>
            <a href="/terms" class="footer-link">Terms of Service</a>
        </div>
        <div class="text-gray-800 font-bold tracking-[1em] text-[10px] uppercase">YT SEO © 2026</div>
    </footer>

    <script>
        const API_ENDPOINT = 'https://gemini-api-beridge.solitontoken.workers.dev';

        async function handleGenerate(isHistory = false) {
            const input = document.getElementById('topicInput');
            const btn = document.getElementById('genBtn');
            const topic = input.value.trim();
            
            if (!topic) return;

            // UI State
            btn.disabled = true;
            document.getElementById('loading').classList.remove('hidden');
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '';
            
            document.title = `${topic.toUpperCase()} | YT SEO`;
            document.getElementById('dynamicHeading').innerHTML = `SEO Power: <span class="text-red-600">${topic}</span>`;

            // Fix URL for GitHub Pages
            if (!isHistory) {
                const slug = topic.toLowerCase().replace(/\s+/g, '-').replace(/[^\w-]+/g, '');
                // Gunakan try-catch untuk pushState guna menghindari security error di beberapa browser
                try {
                    window.history.pushState({topic}, '', window.location.origin + '/' + slug);
                } catch(e) { console.warn("History push failed"); }
            }

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic: topic })
                });

                if (!response.ok) throw new Error('API Response Error');
                
                const data = await response.json();
                
                // Cek keberadaan data.results
                if (data && data.results) {
                    const filtered = data.results.filter(r => r.seo_score >= 1); // Ubah ke 1 dulu untuk testing jika data muncul
                    renderGrid(filtered);
                } else {
                    grid.innerHTML = `<p class="col-span-full text-center text-gray-500 uppercase font-bold tracking-widest">No DNA found for this topic.</p>`;
                }

            } catch (err) {
                console.error("Connection error:", err);
                grid.innerHTML = `<p class="col-span-full text-center text-red-500 uppercase font-bold tracking-widest">Connection lost. Check your Worker CORS settings.</p>`;
            } finally {
                btn.disabled = false;
                document.getElementById('loading').classList.add('hidden');
                grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function renderGrid(results) {
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = ''; 
            let resIdx = 0;

            // Tampilkan maksimal 9 box (termasuk ad)
            for (let i = 1; i <= 9; i++) {
                const box = document.createElement('div');

                // Slot Iklan di posisi 2, 5, 8
                if (i === 2 || i === 5 || i === 8) {
                    box.className = 'ad-box rounded-[2.5rem] p-4 flex flex-col items-center justify-center min-h-[400px] border border-dashed border-white/10 overflow-hidden';
                    box.innerHTML = `
                        <span class="text-[8px] font-bold tracking-[0.3em] text-gray-700 mb-4 uppercase italic">Advertisement</span>
                        <ins class="adsbygoogle" style="display:block; width:100%;" data-ad-client="ca-pub-XXXXXXXXXXXXXXX" data-ad-slot="XXXXXXXXXX" data-ad-format="fluid" data-full-width-responsive="true"></ins>`;
                    grid.appendChild(box);
                    (window.adsbygoogle = window.adsbygoogle || []).push({});
                } else {
                    const res = results[resIdx];
                    if (res) {
                        box.className = 'glass-card rounded-[2.5rem] p-10 flex flex-col justify-between min-h-[450px] transition hover:border-white/20';
                        box.innerHTML = `
                            <div>
                                <div class="flex items-center gap-2 mb-8">
                                    <div class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div>
                                    <span class="text-[10px] font-bold uppercase tracking-widest text-green-500">SEO Score: ${res.seo_score}/10</span>
                                </div>
                                <h3 class="text-2xl font-extrabold mb-6 leading-tight text-white">${res.title}</h3>
                                <p class="premium-desc-text text-sm mb-8">${res.desc}</p>
                            </div>
                            <button onclick="copy('${res.title.replace(/'/g, "\\'")}')" class="w-full py-4 bg-red-600 text-white hover:bg-red-700 transition rounded-xl font-black text-[10px] uppercase tracking-widest">Copy Title</button>`;
                        grid.appendChild(box);
                        resIdx++;
                    }
                }
            }
        }

        function copy(t) { 
            navigator.clipboard.writeText(t).then(() => {
                alert("Metadata Copied to Clipboard!");
            });
        }

        window.onload = () => {
            const path = window.location.pathname.split('/').pop();
            // Hindari auto-generate jika path adalah halaman statis
            const exclude = ['', 'index.html', 'about', 'privacy-policy', 'terms'];
            if (path && !exclude.includes(path)) {
                const topic = decodeURIComponent(path.replace(/-/g, ' '));
                document.getElementById('topicInput').value = topic;
                handleGenerate(true);
            }
        };
    </script>
</body>
</html>
