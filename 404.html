<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">YT SEO Suite - Inject Power into Metadata</title>
    <meta id="metaDesc" name="description" content="Enter your video topic and let our SEO engine forge high-value metadata variations.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- AdSense Header Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-CA-PUB-SILAKAN-GANTI-DISINI" crossorigin="anonymous"></script>
    <style>
        body { background-color: #030303; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .glass-input { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; }
        .glass-input:focus-within { border-color: rgba(220, 38, 38, 0.5); background: rgba(255, 255, 255, 0.05); box-shadow: 0 0 30px -10px rgba(220, 38, 38, 0.3); }
        .tag-pill { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1); color: #666; font-size: 10px; letter-spacing: 0.1em; }
        .glass-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.07); transition: all 0.4s ease; }
        .glass-card:hover { transform: translateY(-5px); border-color: rgba(220, 38, 38, 0.4); background: rgba(255, 255, 255, 0.04); }
        .btn-generate { background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%); cursor: pointer; }
        .premium-desc { color: #9ca3af; line-height: 1.7; font-weight: 400; }
        .ad-box { background: #080808; border: 1px solid #1a1a1a; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="w-full max-w-7xl mx-auto px-8 py-10 flex justify-between items-center">
        <div class="text-3xl font-black tracking-tighter">YT<span class="text-red-600">SEO.</span></div>
        <div class="flex gap-10 text-[11px] font-bold uppercase tracking-[0.3em] text-gray-500">
            <a href="/" class="hover:text-red-500 transition">Engine</a>
            <a href="#faq" class="hover:text-red-500 transition">Intelligence</a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6">
        <!-- Landing Section (Sesuai Gambar Referensi) -->
        <div id="heroSection" class="text-center py-10">
            <h1 id="dynamicHeading" class="text-5xl md:text-7xl font-black tracking-tight mb-6 uppercase">
                Inject <span class="text-red-600">Power</span> into your<br>Metadata
            </h1>
            <p id="dynamicSub" class="premium-desc text-lg md:text-xl max-w-2xl mx-auto mb-12">
                Enter your video topic and let our SEO engine forge high-value metadata variations for your YouTube channel.
            </p>

            <!-- Search Box -->
            <div class="w-full max-w-3xl mx-auto mb-6">
                <div class="glass-input rounded-2xl flex items-center p-2 pl-6">
                    <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="topicInput" placeholder="Example: How to Cook Steak, Stock Market Tips 2024" 
                        class="w-full bg-transparent border-none outline-none px-4 py-4 text-lg text-white placeholder-gray-800">
                    <button onclick="handleGenerate()" class="btn-generate flex items-center gap-2 text-white font-black px-8 py-4 rounded-xl uppercase tracking-widest text-sm">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"></path></svg>
                        Generate
                    </button>
                </div>
            </div>

            <!-- Tag Pills -->
            <div class="flex flex-wrap justify-center gap-3 mb-20">
                <span class="tag-pill px-4 py-1.5 rounded-full font-bold">#SECRET</span>
                <span class="tag-pill px-4 py-1.5 rounded-full font-bold">#VIRAL</span>
                <span class="tag-pill px-4 py-1.5 rounded-full font-bold">#FULL</span>
                <span class="tag-pill px-4 py-1.5 rounded-full font-bold">#REVEALED</span>
            </div>
        </div>

        <!-- Loading & Results -->
        <div id="loading" class="hidden text-center mb-12 text-red-600 font-black animate-pulse tracking-[0.5em] text-xs">ARCHITECTING METADATA...</div>
        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-24"></div>

    </main>

    <footer class="border-t border-white/5 py-20 bg-black text-center">
        <div class="text-gray-700 font-bold tracking-[1em] text-[10px] uppercase">Neural-Link SEO © 2026</div>
    </footer>

    <script>
        const API_ENDPOINT = 'https://gemini-api-beridge.solitontoken.workers.dev';

        async function handleGenerate(isHistory = false) {
            const input = document.getElementById('topicInput');
            const topic = input.value.trim();
            if (!topic) return;

            // UI Changes
            document.title = `${topic.toUpperCase()} | Power SEO`;
            document.getElementById('dynamicHeading').innerHTML = `Neural Assets: <span class="text-red-600">${topic}</span>`;
            document.getElementById('dynamicSub').innerText = "Top-tier metadata engineered for maximum discoverability.";

            if (!isHistory) {
                const slug = topic.toLowerCase().replace(/ /g, '-').replace(/[^\w-]+/g, '');
                window.history.pushState({topic}, '', window.location.origin + '/' + slug);
            }

            document.getElementById('loading').classList.remove('hidden');
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '';

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic: topic })
                });
                const data = await response.json();
                renderGrid(data.results.filter(r => r.seo_score >= 6));
            } catch (err) {
                console.error("Connection lost.");
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('resultsGrid').scrollIntoView({ behavior: 'smooth' });
            }
        }

        function renderGrid(results) {
            const grid = document.getElementById('resultsGrid');
            let resIdx = 0;
            for (let i = 1; i <= 9; i++) {
                const box = document.createElement('div');
                if (i === 2 || i === 5 || i === 8) {
                    box.className = 'ad-box rounded-[2.5rem] p-4 flex flex-col items-center justify-center min-h-[400px]';
                    box.innerHTML = `
                        <span class="text-[8px] font-bold tracking-[0.3em] text-gray-600 mb-4 uppercase italic">Advertisement</span>
                        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-CA-PUB-SILAKAN-GANTI-DISINI" data-ad-slot="ID-UNIT-IKLAN-DISINI" data-ad-format="fluid" data-ad-layout-key="-fb+5w+4e-db+86" data-full-width-responsive="true"></ins>
                        <script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script>`;
                } else {
                    const res = results[resIdx];
                    if (res) {
                        box.className = 'glass-card rounded-[2.5rem] p-10 flex flex-col justify-between min-h-[450px]';
                        box.innerHTML = `
                            <div>
                                <div class="flex items-center gap-2 mb-8">
                                    <div class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div>
                                    <span class="text-[10px] font-bold uppercase tracking-widest text-green-500">SEO Score: ${res.seo_score}/10</span>
                                </div>
                                <h3 class="text-2xl font-extrabold mb-6 leading-tight text-white">${res.title}</h3>
                                <p class="premium-desc text-sm mb-8">${res.desc}</p>
                            </div>
                            <button onclick="copy('${res.title}')" class="w-full py-4 bg-red-600 text-white hover:bg-red-700 transition rounded-xl font-black text-[10px] uppercase tracking-widest">Copy Title</button>`;
                        resIdx++;
                    }
                }
                grid.appendChild(box);
            }
        }

        function copy(t) { navigator.clipboard.writeText(t); alert("Copied!"); }

        window.onload = () => {
            const path = window.location.pathname.split('/').pop();
            if (path && !path.includes('.html') && path !== 'gecko-seo-suite') {
                const topic = path.replace(/-/g, ' ');
                document.getElementById('topicInput').value = topic;
                handleGenerate();
            }
        };
    </script>
</body>
</html>
