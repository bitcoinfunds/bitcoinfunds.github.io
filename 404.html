<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">YT SEO Suite - Premium AI Metadata Architect</title>
    <meta id="metaDesc" name="description" content="Elevate your YouTube performance with AI-driven metadata optimization.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background-color: #0d0d0d; /* Latar belakang gelap total sesuai gambar */
            color: #ffffff; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden; 
        }
        
        /* KOMPONEN INPUT GROUP (Search Bar) - 100% Identik */
        .search-container {
            display: flex;
            align-items: center;
            background-color: #111111; /* Warna gelap input saat diam */
            border: 1px solid #222222;
            border-radius: 20px; /* Radius kelengkungan besar sesuai gambar */
            padding: 6px;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        /* Saat Container di-klik (Focus) */
        .search-container:focus-within {
            border-color: #ef4444; /* Border berubah merah saat focus */
            background-color: #111111 !important; /* KUNCI: Tetap gelap saat focus */
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); /* Efek glow merah halus */
        }

        /* Ikon Pencarian Merah */
        .search-icon { 
            color: #ef4444; 
            margin-left: 18px; 
            margin-right: 12px; 
            flex-shrink: 0; 
        }

        /* INPUT TEKS */
        .search-input {
            flex-grow: 1;
            background-color: transparent; /* Transparan agar mengikuti container */
            border: none;
            outline: none;
            color: #ffffff; /* Warna teks putih */
            font-size: 16px;
            font-weight: 600;
            padding: 12px 0;
            
            /* KUNCI PERBAIKAN: Menghilangkan Warna Putih dari Autofill/Autocomplete Browser */
            -webkit-text-fill-color: #ffffff !important; /* Memaksa warna teks tetap putih */
            -webkit-box-shadow: 0 0 0px 1000px #111111 inset !important; /* Menutup autofill dengan warna gelap kita */
            box-shadow: 0 0 0px 1000px #111111 inset !important; /* Cadangan untuk browser lain */
            color-scheme: dark; /* Memberitahu browser untuk menggunakan UI dark */
        }

        /* Warna Placeholder Abu-abu Tua */
        .search-input::placeholder { 
            color: #444444; 
            font-weight: 600; 
        }

        /* TOMBOL GENERATE PREMIUM */
        .generate-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            /* Gradien merah tua ke merah hati sesuai gambar */
            background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px; /* Radius sedikit lebih kecil dari container */
            padding: 12px 24px;
            font-size: 13px;
            font-weight: 800; /* Extra Bold */
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .generate-btn:hover {
            filter: brightness(1.1); /* Sedikit lebih terang saat hover */
        }

        /* Results & Tags Style */
        .glass-card { 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid rgba(255, 255, 255, 0.07); 
            transition: all 0.4s ease; 
        }
        .tag-pill { 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #666; 
            font-size: 10px; 
            letter-spacing: 0.1em; 
        }
        .premium-desc-text { 
            color: #9ca3af; 
            line-height: 1.7; 
            font-weight: 400; 
        }
    </style>
</head>
<body class="min-h-screen">

    <nav class="w-full max-w-7xl mx-auto px-8 py-10 flex justify-between items-center">
        <div class="text-3xl font-black tracking-tighter">YT<span class="text-red-600">SEO.</span></div>
    </nav>

    <main class="max-w-7xl mx-auto px-6">
        <!-- Hero Section -->
        <div class="text-center py-10">
            <h1 id="dynamicHeading" class="text-5xl md:text-7xl font-black tracking-tight mb-6 uppercase">
                Inject <span class="text-red-600">Power</span> into your<br>Metadata
            </h1>
            <p id="dynamicSub" class="premium-desc-text text-lg md:text-xl max-w-2xl mx-auto mb-12">
                Enter your video topic and let our SEO engine forge high-value metadata variations for your YouTube channel.
            </p>

            <!-- THE PERFECT SEARCH COMPONENT (Identical to Image) -->
            <div class="search-container mb-6">
                <!-- Ikon Pencarian SVG Merah -->
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                
                <!-- Input Teks dengan Fix Autofill -->
                <input type="text" id="topicInput" class="search-input" placeholder="Example: How to Cook Steak, Stock Market Tips 2024" autocomplete="off">
                
                <!-- Tombol Generate dengan Ikon Kilat -->
                <button onclick="handleGenerate()" class="generate-btn">
                    <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"></path>
                    </svg>
                    Generate
                </button>
            </div>

            <!-- Tag Pills (Abu-abu Tua) -->
            <div class="flex flex-wrap justify-center gap-3 mb-20">
                <span class="tag-pill px-4 py-1.5 rounded-full font-bold">#SECRET</span>
                <span class="tag-pill px-4 py-1.5 rounded-full font-bold">#VIRAL</span>
                <span class="tag-pill px-4 py-1.5 rounded-full font-bold">#FULL</span>
                <span class="tag-pill px-4 py-1.5 rounded-full font-bold">#REVEALED</span>
            </div>
        </div>

        <!-- Loading & Results Grid -->
        <div id="loading" class="hidden text-center mb-12 text-red-600 font-black animate-pulse tracking-[0.5em] text-xs">ARCHITECTING ASSETS...</div>
        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-24"></div>
    </main>

    <footer class="border-t border-white/5 py-20 bg-black text-center">
        <div class="text-gray-700 font-bold tracking-[1em] text-[10px] uppercase">Neural-Link SEO © 2026</div>
    </footer>

    <script>
        const API_ENDPOINT = 'https://gemini-api-beridge.solitontoken.workers.dev';

        async function handleGenerate(isHistory = false) {
            const input = document.getElementById('topicInput');
            const topic = input.value.trim();
            if (!topic) return;

            // Update UI
            document.title = `${topic.toUpperCase()} | YT SEO`;
            document.getElementById('dynamicHeading').innerHTML = `Neural Assets: <span class="text-red-600">${topic}</span>`;
            
            if (!isHistory) {
                const slug = topic.toLowerCase().replace(/ /g, '-').replace(/[^\w-]+/g, '');
                window.history.pushState({topic}, '', window.location.origin + '/' + slug);
            }

            document.getElementById('loading').classList.remove('hidden');
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '';

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic: topic })
                });
                const data = await response.json();
                renderGrid(data.results.filter(r => r.seo_score >= 6));
            } catch (err) {
                console.error("Connection error");
            } finally {
                document.getElementById('loading').classList.add('hidden');
                grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function renderGrid(results) {
            const grid = document.getElementById('resultsGrid');
            let resIdx = 0;
            for (let i = 1; i <= 9; i++) {
                const box = document.createElement('div');
                if (i === 2 || i === 5 || i === 8) {
                    // ADSENSE SLOT
                    box.className = 'ad-box rounded-[2.5rem] p-4 flex flex-col items-center justify-center min-h-[400px] border border-dashed border-white/10';
                    box.innerHTML = `
                        <span class="text-[8px] font-bold tracking-[0.3em] text-gray-700 mb-4 uppercase italic">Advertisement</span>
                        <div class="text-gray-800 text-xs font-bold leading-relaxed">ADSENSE GLOBAL<br>PREMIUM UNIT</div>`;
                } else {
                    const res = results[resIdx];
                    if (res) {
                        box.className = 'glass-card rounded-[2.5rem] p-10 flex flex-col justify-between min-h-[450px]';
                        box.innerHTML = `
                            <div>
                                <div class="flex items-center gap-2 mb-8">
                                    <div class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div>
                                    <span class="text-[10px] font-bold uppercase tracking-widest text-green-500">SEO Power: ${res.seo_score}/10</span>
                                </div>
                                <h3 class="text-2xl font-extrabold mb-6 leading-tight text-white">${res.title}</h3>
                                <p class="premium-desc-text text-sm mb-8">${res.desc}</p>
                            </div>
                            <button onclick="copy('${res.title}')" class="w-full py-4 bg-red-600 text-white hover:bg-red-700 transition rounded-xl font-black text-[10px] uppercase tracking-widest">Copy Title</button>`;
                        resIdx++;
                    }
                }
                grid.appendChild(box);
            }
        }

        function copy(t) { navigator.clipboard.writeText(t); alert("Metadata Copied!"); }

        window.onload = () => {
            const path = window.location.pathname.split('/').pop();
            if (path && !path.includes('.html') && path !== 'gecko-seo-suite') {
                const topic = path.replace(/-/g, ' ');
                document.getElementById('topicInput').value = topic;
                handleGenerate();
            }
        };
    </script>
</body>
</html>
