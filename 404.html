<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta tags dinamis akan diupdate oleh JS -->
    <title id="metaTitle">YT SEO Power Suite - AI Metadata</title>
    <meta id="metaDesc" name="description" content="Generate high-converting YouTube metadata with our AI engine.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #080808; color: #ffffff; }
        .yt-red-gradient { background: linear-gradient(135deg, #ff0000 0%, #990000 100%); }
        .card-bg { background-color: #121212; border: 1px solid #1f1f1f; }
        .adsense-placeholder { background: #0f0f0f; border: 2px dashed #222; position: relative; overflow: hidden; }
        .adsense-placeholder::before { content: 'SPONSORED AD'; position: absolute; top: 10px; left: 10px; font-size: 9px; color: #444; font-weight: 900; letter-spacing: 2px; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .line-clamp-title { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="custom-scroll flex flex-col min-h-screen">

    <nav class="flex justify-between items-center px-8 py-6 max-w-7xl mx-auto w-full border-b border-white/5">
        <div class="text-xl font-bold tracking-tighter cursor-pointer" onclick="window.location.href='/'">YT<span class="text-red-600">METADATA</span></div>
    </nav>

    <section class="text-center py-16 px-4 flex-grow">
        <h1 id="dynamicHeroTitle" class="text-4xl md:text-7xl font-black mb-6 tracking-tight leading-[0.9]">
            Inject <span class="text-red-600">Power</span> into your<br>Metadata
        </h1>
        
        <div class="max-w-2xl mx-auto relative group">
            <form id="seoForm" class="relative flex flex-col md:flex-row gap-2 bg-[#121212] p-2 rounded-2xl border border-white/10 shadow-2xl">
                <input type="text" id="topicInput" placeholder="Enter video topic..." 
                    class="flex-1 bg-transparent px-6 py-4 outline-none text-white text-xl font-bold placeholder:text-gray-700">
                <button type="submit" class="yt-red-gradient px-12 py-5 rounded-xl text-xs font-black tracking-[0.2em] hover:scale-[1.02] transition shadow-xl">
                    GENERATE
                </button>
            </form>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-6 py-10 w-full">
        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <script>
        const titleTemplates = [
            (topic) => `Secret Revealed! The Real Way to ${topic} That Nobody Tells You`,
            (topic) => `Finally! The Most Effective Strategy for ${topic} in 2026`,
            (topic) => `Stop Failing! Use This Proven Method for ${topic} Instead`
        ];

        const heroTitleTemplates = [
            (topic) => `Dominate Search with <span class="text-red-600">${topic}</span>`,
            (topic) => `Rank #1 for <span class="text-red-600">${topic}</span> Today`
        ];

        // LOGIKA AUTO-LOAD (Sangat Penting untuk URL Dinamis)
        window.addEventListener('DOMContentLoaded', () => {
            // Cek apakah ada path di URL (misal: /mortgage-money)
            const path = window.location.pathname.split('/').pop();
            
            if (path && path !== "" && path !== "index.html" && path !== "404.html" && path !== "seo.html") {
                const cleanTopic = path.replace(/-/g, ' ');
                document.getElementById('topicInput').value = cleanTopic;
                generateMetadata(cleanTopic, false); // Jalankan tanpa scroll otomatis di awal
            }
        });

        // Handler untuk Form
        document.getElementById('seoForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const topic = document.getElementById('topicInput').value.trim();
            if (topic) {
                // Update URL tanpa reload agar terlihat seperti halaman baru
                const slug = topic.toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, '-');
                window.history.pushState({topic: topic}, '', `/${slug}`);
                generateMetadata(topic, true);
            }
        });

        function generateMetadata(rawTopic, shouldScroll) {
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = `<div class="col-span-full text-center py-20 text-gray-600 font-black animate-pulse">GENERATING FOR ${rawTopic.toUpperCase()}...</div>`;

            setTimeout(() => {
                grid.innerHTML = "";
                
                // Update Judul & Meta
                document.title = `${rawTopic.toUpperCase()} - SEO Metadata Suite`;
                const heroGen = heroTitleTemplates[Math.floor(Math.random() * heroTitleTemplates.length)];
                document.getElementById('dynamicHeroTitle').innerHTML = heroGen(rawTopic);

                // Render Kartu (Sederhana untuk contoh)
                for (let i = 1; i <= 6; i++) {
                    const title = titleTemplates[i % titleTemplates.length](rawTopic);
                    grid.innerHTML += `
                        <div class="card-bg p-8 rounded-[2rem] flex flex-col gap-4">
                            <span class="text-[9px] font-black text-gray-700 uppercase tracking-widest">Result #${i}</span>
                            <h2 class="text-xl font-bold leading-tight">${title}</h2>
                            <button class="mt-4 py-3 bg-red-600 rounded-xl text-[10px] font-black uppercase tracking-widest">Copy Metadata</button>
                        </div>`;
                }

                if (shouldScroll) {
                    window.scrollTo({ top: 450, behavior: 'smooth' });
                }
            }, 600);
        }
    </script>
</body>
</html>
