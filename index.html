<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Input Replica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d0d0d; /* Latar belakang gelap total sesuai gambar */
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Container Utama Input Group */
        .search-container {
            display: flex;
            align-items: center;
            background-color: #111111; /* Warna gelap input saat diam */
            border: 1px solid #222222; /* Border tipis gelap */
            border-radius: 20px; /* Radius kelengkungan besar sesuai gambar */
            padding: 6px; /* Padding dalam untuk memberi ruang tombol */
            width: 100%;
            max-width: 720px; /* Lebar maksimal mendekati referensi */
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Style saat Container di-klik (Focus) */
        .search-container:focus-within {
            border-color: #ef4444; /* Border berubah merah saat focus */
            background-color: #111111 !important; /* KUNCI: Tetap gelap saat focus */
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); /* Efek glow merah halus */
        }

        /* Ikon Pencarian Merah */
        .search-icon {
            color: #ef4444; /* Warna merah cerah */
            margin-left: 18px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        /* Input Teks */
        .search-input {
            flex-grow: 1;
            background-color: transparent; /* Transparan agar mengikuti container */
            border: none;
            outline: none;
            color: #ffffff; /* Warna teks putih */
            font-size: 16px;
            font-weight: 600;
            padding: 12px 0;
        }

        /* Placeholder Teks Abu-abu Tua */
        .search-input::placeholder {
            color: #444444; /* Warna abu-abu tua sesuai gambar */
            font-weight: 600;
        }

        /* Tombol Generate Premium */
        .generate-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            /* Gradien merah tua ke merah hati sesuai gambar */
            background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px; /* Radius sedikit lebih kecil dari container */
            padding: 12px 24px;
            font-size: 13px;
            font-weight: 800; /* Extra Bold */
            text-transform: uppercase;
            letter-spacing: 0.1em; /* Jarak antar huruf */
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            margin-left: 10px;
        }

        /* Efek Hover Tombol */
        .generate-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.1); /* Sedikit lebih terang saat hover */
        }

        /* Efek Klik Tombol */
        .generate-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <!-- Komponen Input Group Utuh -->
    <div class="search-container">
        <!-- Ikon Pencarian SVG -->
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        
        <!-- Input Teks dengan Placeholder -->
        <input type="text" class="search-input" placeholder="Example: How to Cook Steak, Stock Market Tips 2024">
        
        <!-- Tombol Generate dengan Ikon Kilat -->
        <button class="generate-btn">
            <!-- Ikon Kilat SVG -->
            <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"></path>
            </svg>
            Generate
        </button>
    </div>

</body>
</html>
