<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">YT SEO Suite - AI Metadata Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #080808; color: white; font-family: 'Inter', sans-serif; }
        .card-bg { background: #121212; border: 1px solid #1f1f1f; }
        /* Animasi Skeleton untuk loading */
        .skeleton { background: linear-gradient(90deg, #1a1a1a 25%, #222 50%, #1a1a1a 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="min-h-screen">

    <nav class="p-6 border-b border-white/5 max-w-7xl mx-auto flex justify-between">
        <div class="font-black text-xl tracking-tighter cursor-pointer" onclick="window.location.href='/'">YT<span class="text-red-600">SEO</span></div>
    </nav>

    <main class="max-w-4xl mx-auto pt-20 px-4">
        <h1 id="heroTitle" class="text-5xl md:text-7xl font-black text-center leading-[0.9] mb-10">
            Dapatkan Judul <span class="text-red-600 text-shadow">Viral</span> Dengan AI
        </h1>

        <form id="seoForm" class="flex flex-col md:flex-row gap-2 bg-[#121212] p-2 rounded-2xl border border-white/10 shadow-2xl mb-20">
            <input type="text" id="topicInput" placeholder="Masukkan topik video..." 
                class="flex-1 bg-transparent px-6 py-4 outline-none text-xl font-bold placeholder:text-gray-800">
            <button type="submit" class="bg-red-600 px-10 py-4 rounded-xl font-black tracking-widest hover:bg-red-700 transition">GENERATE</button>
        </form>

        <!-- Slot Iklan Atas -->
        <div class="h-24 bg-white/5 rounded-xl mb-10 flex items-center justify-center text-[10px] text-gray-700 font-bold tracking-widest border border-dashed border-white/10">ADSENSE AD SPACE</div>

        <div id="resultsArea" class="space-y-8 pb-20">
            <!-- Hasil akan muncul di sini -->
        </div>
    </main>

    <script>
        const API_ENDPOINT = 'https://gemini-api-beridge.solitontoken.workers.dev'; // Ganti dengan URL Cloudflare Worker Anda nanti

        // 1. CEK URL SAAT LOAD (UNTUK RELOAD STRATEGY)
        window.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname.split('/').pop();
            if (path && !['index.html', ''].includes(path)) {
                const topic = path.replace(/-/g, ' ');
                document.getElementById('topicInput').value = topic;
                callGeminiAI(topic);
            }
        });

        // 2. FORM SUBMIT (TRIGGER RELOAD)
        document.getElementById('seoForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const topic = document.getElementById('topicInput').value.trim();
            if (topic) {
                const slug = topic.toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, '-');
                // Alih-alih AJAX, kita reload halaman ke URL baru agar AdSense refresh
                window.location.href = '/' + slug;
            }
        });

        async function callGeminiAI(topic) {
            const container = document.getElementById('resultsArea');
            container.innerHTML = `<div class="h-64 skeleton rounded-3xl"></div>`; // Loading state

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    body: JSON.stringify({ topic: topic })
                });
                const data = await response.json();
                renderResults(data.results, topic);
            } catch (err) {
                container.innerHTML = `<p class="text-center text-red-500">Gagal mengambil data. Pastikan API Worker sudah aktif.</p>`;
            }
        }

        function renderResults(results, topic) {
            const container = document.getElementById('resultsArea');
            container.innerHTML = "";
            document.title = `SEO Metadata untuk ${topic.toUpperCase()}`;

            results.forEach((res, i) => {
                container.innerHTML += `
                    <div class="card-bg p-8 rounded-[2rem] space-y-4">
                        <div class="flex justify-between items-center text-[10px] font-black tracking-widest text-gray-600">
                            <span>HASIL #${i+1}</span>
                            <span class="text-green-500">9.8/10 SEO SCORE</span>
                        </div>
                        <h2 class="text-2xl font-bold">${res.title}</h2>
                        <p class="text-gray-400 text-sm leading-relaxed">${res.desc}</p>
                        <button onclick="copyText('${res.title}', '${res.desc}')" class="w-full py-4 bg-white/5 rounded-xl text-[10px] font-black uppercase hover:bg-white/10 transition mt-4">Salin Metadata</button>
                    </div>
                `;
                // Sisipkan Iklan setelah hasil ke-2
                if(i === 1) {
                    container.innerHTML += `<div class="h-48 bg-white/5 rounded-3xl flex items-center justify-center text-[10px] text-gray-700 font-bold border border-dashed border-white/10">MID-CONTENT ADSENSE</div>`;
                }
            });
        }

        function copyText(t, d) {
            navigator.clipboard.writeText(`Judul: ${t}\n\nDeskripsi: ${d}`);
            alert('Metadata disalin!');
        }
    </script>
</body>
</html>
